name: Build Royal Bingo Pro 500 (.EXE + .APK + .AAB) & Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ============================================================================
  # JOB 1: BUILD WINDOWS DESKTOP .EXE INSTALLER (NSIS + PRE-BUNDLED AMHARIC VOICES)
  # ============================================================================
  build-windows-exe:
    name: "Job 1 — Build Windows .EXE (NSIS + Offline Amharic Neural Voices)"
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate Multi-Resolution Icons
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install Pillow edge-tts
          python scripts/generate_icons.py || true

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Dependencies & Build Windows .EXE (NSIS)
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --win nsis --x64 --publish never
          EXE_FOUND=$(find dist -maxdepth 1 -name "*.exe" | head -n 1)
          if [ -n "$EXE_FOUND" ]; then
            cp "$EXE_FOUND" dist/RoyalBingoPro_Setup.exe || true
            cp "$EXE_FOUND" dist/RoyalBingoPro_Setup_v1.0.0.exe || true
          fi

      - name: Upload Windows .EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoyalBingoPro-Windows-EXE
          path: |
            dist/RoyalBingoPro_Setup.exe
            dist/RoyalBingoPro_Setup_v1.0.0.exe

  # ============================================================================
  # JOB 2: BUILD SIGNED ANDROID .APK & .AAB (PRE-INSTALLED ANDROID SDK + JAVA 21)
  # ============================================================================
  build-android-apk:
    name: "Job 2 — Build Signed Android .APK & .AAB (500-Cartela + Admin Keygen)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare Mobile Assets
        run: |
          pip install Pillow edge-tts
          python scripts/generate_icons.py || true
          mkdir -p mobile/www
          cp shared/royal-bingo-core.js mobile/www/royal-bingo-core.js
          cp assets/logo.svg mobile/www/logo.svg

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java JDK 21 (Required by Capacitor 6 & Android Gradle 8+)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Build Signed Android .APK + .AAB
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

          npm install --no-audit --no-fund
          rm -rf android
          npx cap add android
          npx cap sync android

          # Production Keystore
          rm -f android/app/royal-bingo-release.keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d ' \t\n\r' | base64 -d > android/app/royal-bingo-release.keystore || true
          fi
          if [ ! -s "android/app/royal-bingo-release.keystore" ]; then
            rm -f android/app/royal-bingo-release.keystore
            keytool -genkeypair -v \
              -keystore android/app/royal-bingo-release.keystore \
              -alias royalbingo \
              -keyalg RSA \
              -keysize 2048 \
              -validity 18250 \
              -storepass "RoyalBingo2026!" \
              -keypass "RoyalBingo2026!" \
              -dname "CN=RoyalCraft Software PLC, OU=Bingo Division, O=RoyalCraft, L=Addis Ababa, ST=Addis Ababa, C=ET"
          fi

          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$PWD/app/royal-bingo-release.keystore \
            -Pandroid.injected.signing.store.password="RoyalBingo2026!" \
            -Pandroid.injected.signing.key.alias="royalbingo" \
            -Pandroid.injected.signing.key.password="RoyalBingo2026!"

          mkdir -p ../dist-android
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          AAB_FILE=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          cp "$APK_FILE" ../dist-android/RoyalBingoPro_500Cartela_v1.0.0.apk
          cp "$AAB_FILE" ../dist-android/RoyalBingoPro_500Cartela_v1.0.0.aab
          ls -lh ../dist-android/

      - name: Upload Android .APK & .AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RoyalBingoPro-Android-APK-AAB
          path: |
            dist-android/RoyalBingoPro_500Cartela_v1.0.0.apk
            dist-android/RoyalBingoPro_500Cartela_v1.0.0.aab

  # ============================================================================
  # JOB 3: PUBLISH DIRECT DOWNLOAD RELEASE (.EXE + .APK + .AAB) ON GITHUB RELEASES
  # ============================================================================
  publish-release:
    name: "Job 3 — Publish Direct Download Links to GitHub Releases"
    needs: [build-windows-exe, build-android-apk]
    runs-on: ubuntu-latest

    steps:
      - name: Download Built Windows .EXE Artifact
        uses: actions/download-artifact@v4
        with:
          name: RoyalBingoPro-Windows-EXE
          path: release-assets

      - name: Download Built Android .APK & .AAB Artifacts
        uses: actions/download-artifact@v4
        with:
          name: RoyalBingoPro-Android-APK-AAB
          path: release-assets

      - name: Create / Update GitHub Release with Direct Download Links
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: "ሮያል ቢንጎ ፕሮ (Royal Bingo Pro 500) — Official Release v2.0.0"
          body: |
            ## 👑 ሮያል ቢንጎ ፕሮ (Royal Bingo Pro 500) — Commercial Bingo Suite v2.0
            - **💻 የኮምፒውተር ሶፍትዌር (`.EXE`)**: `RoyalBingoPro_Setup.exe`
            - **📱 የስልክ 500-ካርቴላ እና Admin መተግበሪያ (`.APK`)**: `RoyalBingoPro_500Cartela_v1.0.0.apk`
            - **📦 Google Play Bundle (`.AAB`)**: `RoyalBingoPro_500Cartela_v1.0.0.aab`
            - **📞 Wallet Top-Up Contact**: `+251 925432016` / `@OneGBEthiopia` (`CBE: 1000212746367 | Telebirr: 0925432016`)
          files: |
            release-assets/RoyalBingoPro_Setup.exe
            release-assets/RoyalBingoPro_Setup_v1.0.0.exe
            release-assets/RoyalBingoPro_500Cartela_v1.0.0.apk
            release-assets/RoyalBingoPro_500Cartela_v1.0.0.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

