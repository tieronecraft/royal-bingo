<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="royalBg" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="65%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#facc15"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <linearGradient id="ethGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="ethRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#facc15" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Outer Rounded Casino Shield -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#royalBg)" stroke="url(#goldGrad)" stroke-width="12"/>
  <rect x="34" y="34" width="444" height="444" rx="80" fill="none" stroke="#eab308" stroke-opacity="0.4" stroke-width="3" stroke-dasharray="12 8"/>

  <!-- Habesha Tri-Color Ribbon Arc -->
  <path d="M 96 115 Q 256 55 416 115" fill="none" stroke="url(#ethGreen)" stroke-width="10" stroke-linecap="round"/>
  <path d="M 106 130 Q 256 70 406 130" fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round"/>
  <path d="M 116 145 Q 256 85 396 145" fill="none" stroke="url(#ethRed)" stroke-width="10" stroke-linecap="round"/>

  <!-- Royal Crown -->
  <path d="M 140 215 L 118 135 L 195 178 L 256 105 L 317 178 L 394 135 L 372 215 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
  <circle cx="118" cy="128" r="11" fill="#fef08a"/>
  <circle cx="256" cy="98" r="14" fill="#fef08a"/>
  <circle cx="394" cy="128" r="11" fill="#fef08a"/>

  <!-- Central Golden Bingo Sphere -->
  <circle cx="256" cy="305" r="94" fill="url(#goldGrad)" filter="url(#glow)"/>
  <circle cx="256" cy="305" r="76" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="5"/>

  <!-- "ሮያል ቢንጎ" Inside Sphere -->
  <text x="256" y="295" text-anchor="middle" fill="#fef08a" font-family="'Nyala', 'Noto Sans Ethiopic', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="34">ሮያል ቢንጎ</text>
  <text x="256" y="340" text-anchor="middle" fill="#22c55e" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="32">500 PRO</text>

  <!-- Bottom Uncut Title Banner -->
  <rect x="96" y="420" width="320" height="54" rx="14" fill="#020617" stroke="url(#goldGrad)" stroke-width="3"/>
  <text x="256" y="458" text-anchor="middle" fill="#facc15" font-family="'Nyala', 'Noto Sans Ethiopic', 'Segoe UI', sans-serif" font-weight="900" font-size="28">ሮያል ቢንጎ ፕሮ</text>
</svg>
